name: Setup
description: Install pnpm (version from package.json), Node 24 and the locked dependencies, with the pnpm store cached.

inputs:
  cache:
    description: Use the pnpm store cache (restored, then saved at the end of the job). Every evolution job passes "false". Jobs that run agent or PR code mustn't write a cache that trusted jobs restore, and jobs that hold secrets don't restore one that code left running in such a job could have written.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.cache == 'true' }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
