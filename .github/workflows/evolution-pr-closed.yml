name: evolution-pr-closed

# When an evolution PR is closed without merging, the feedback the build marked building on it goes back to triaged
# and loses the PR link, so the board doesn't show a closed PR as in progress. A merged PR is post-merge's job.
# It also deletes the PR's evo/ branch (contents: write), as GitHub does on merge, so the issue can be built again.
# pull_request_target checks out main, never the PR, so only main's code runs next to the Supabase key.
# No gate: it only undoes what the build recorded, then dispatches the next build, whose own gate applies.
# workflow_dispatch backfills a PR closed before this existed.
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the closed evolution PR
        required: true

permissions:
  contents: read

jobs:
  reset-feedback:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == false &&
       (contains(github.event.pull_request.labels.*.name, 'evolution') || startsWith(github.event.pull_request.head.ref, 'evo/')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Put the closed PR's feedback back to triaged
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: pnpm -s evolution:pr-closed "$PR"

      # Closing the PR freed the one open-PR slot, so start the build for the oldest evolution:ready issue, if any,
      # as post-merge does after a merge. The build's gate still decides whether it may run.
      - name: Start the next build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label evolution:ready --limit 1 --json number --jq length)
          if [ "$ready" = "0" ]; then echo "No evolution:ready issue is waiting."; exit 0; fi
          gh workflow run evolution-build.yml --repo "$GITHUB_REPOSITORY"
