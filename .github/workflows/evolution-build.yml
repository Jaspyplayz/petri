name: evolution-build

# Builds one evolution:ready issue. The agent's code never runs where the secrets are:
#   pick     trusted code: gate, pick the issue, mark its feedback building
#   agent    no secrets: the builder edits a checkout; only its patch, JSON report and usage numbers leave the job
#   usage    secrets, but never runs the agent's code: records the builder's turns and runtime in agent_runs
#   verify   no secrets: checks and applies the patch, runs pnpm check, verify:all and verify:compare
#   publish  secrets, but never runs the PR's code: pushes the branch and opens the PR with the evolution app's token
# The cron fallback is added after the Phase 6 dry run (docs/decisions.md).
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to build (empty for the oldest evolution:ready issue)
        required: false
        default: ""

permissions:
  contents: read

# One build at a time. Every new issue gets three labels at once (evolution, evolution:ready, risk:*), and each starts
# a run. Only the ones that can build share the group: in a shared group, a skipped run for another label cancelled
# the pending evolution:ready run (#48's). The others get a group of their own and finish at once.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'evolution:ready') && 'evolution-build' || format('evolution-build-other-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  pick:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'evolution:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      found: ${{ steps.pick.outputs.found }}
      number: ${{ steps.pick.outputs.number }}
      branch: ${{ steps.pick.outputs.branch }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Gate (EVOLUTION_ENABLED, .evolution/PAUSED, maxOpenEvolutionPRs, weekly budget)
        id: gate
        env:
          EVOLUTION_ENABLED: ${{ vars.EVOLUTION_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm -s evolution:gate build

      - name: Pick the issue (only one triage filed)
        if: steps.gate.outputs.open == 'true'
        id: pick
        env:
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm -s evolution:pick-issue "$ISSUE"

      - name: Mark the linked feedback building
        if: steps.pick.outputs.found == 'true'
        env:
          NUMBER: ${{ steps.pick.outputs.number }}
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm -s evolution:feedback-status building "$NUMBER"

      - if: steps.pick.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evolution-issue
          path: artifacts/evolution/issue.json
          retention-days: 30

  agent:
    needs: pick
    if: needs.pick.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No id-token: the action gets the read-only GITHUB_TOKEN instead of minting a Claude App token that code the
    # builder runs could also mint.
    permissions:
      contents: read
    outputs:
      report: ${{ steps.builder.outputs.structured_output }}
      usage: ${{ steps.usage.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - uses: ./.github/actions/app-stack
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evolution-issue
          path: artifacts/evolution
      - name: Agent settings from .evolution/
        id: agent
        run: pnpm -s evolution:agent-config build

      - name: Agent sandbox (the secret scrub needs bubblewrap, or the CLI won't install)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version

      - name: Builder agent (edits the checkout; can't commit, push or reach the web)
        id: builder
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post-merge and pr-closed dispatch the next build with their job token, so the actor is github-actions,
          # and the action refuses a bot it isn't told about. Only this repository's workflows can dispatch as it.
          # Triage's issues get evolution:ready from the evolution app, which is then the actor.
          allowed_bots: github-actions,petri-evolution-bot
          github_token: ${{ github.token }}
          prompt: ${{ steps.agent.outputs.prompt }}
          # A `:*` rule matches its prefix followed by a space, so `Bash(pnpm verify:*)` never allowed
          # `pnpm verify:flow …`, and the builder of #63 couldn't run a single flow. Name each verify script.
          claude_args: >-
            --model ${{ steps.agent.outputs.model }}
            --max-turns ${{ steps.agent.outputs.max_turns }}
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,TodoWrite,Task,Bash(pnpm check),Bash(pnpm verify:flow:*),Bash(pnpm verify:script:*),Bash(pnpm verify:all),Bash(pnpm verify:compare:*),Bash(pnpm featuremap),Bash(pnpm new:feature:*),Bash(pnpm test:*),Bash(pnpm typecheck),Bash(pnpm lint),Bash(git status),Bash(git diff:*)"
            --disallowedTools "WebFetch,WebSearch"
            --json-schema '${{ steps.agent.outputs.json_schema }}'

      # Only jq, never the checkout's code. The builder could have changed this runner, so the usage job treats the
      # numbers as a report and bounds them; --max-turns and the timeout cap the run whatever it reports.
      - name: Agent usage (jq reads the action's log)
        if: always()
        id: usage
        env:
          LOG: ${{ steps.builder.outputs.execution_file }}
        run: |
          if [ -n "$LOG" ] && [ -f "$LOG" ]; then
            echo "json=$(jq -c '[.[] | select(.type == "result")] | last | {turns: .num_turns, durationMs: .duration_ms, costUsd: .total_cost_usd, isError: .is_error, subtype: .subtype}' "$LOG")" >> "$GITHUB_OUTPUT"
          fi

      - name: The builder's patch
        run: |
          git add -A
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/evolution.patch"
          git diff --cached --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evolution-patch
          path: ${{ runner.temp }}/evolution.patch
          retention-days: 30

  usage:
    needs: [pick, agent]
    if: always() && needs.pick.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # main's code only: this job never sees the agent's checkout or patch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Record the run in agent_runs
        env:
          RESULT: ${{ needs.agent.result }}
          USAGE: ${{ needs.agent.outputs.usage }}
          ISSUE: ${{ needs.pick.outputs.number }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm -s evolution:record-run builder

  verify:
    needs: [pick, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      flows: ${{ steps.report.outputs.flows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          fetch-depth: 0 # verify:compare builds origin/main
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evolution-patch
          path: ${{ runner.temp }}
      - name: Check the builder's report
        id: report
        env:
          REPORT: ${{ needs.agent.outputs.report }}
        run: |
          printf '%s' "$REPORT" > "$RUNNER_TEMP/report.json"
          pnpm -s evolution:build-report "$RUNNER_TEMP/report.json"
      - name: Stop if the builder was blocked
        if: steps.report.outputs.outcome != 'done'
        env:
          REASON: ${{ steps.report.outputs.reason }}
        run: |
          echo "::error::The builder stopped: $REASON"
          exit 1
      - name: Check the patch before applying it (protected paths, binaries, size)
        run: pnpm -s evolution:check-patch "$RUNNER_TEMP/evolution.patch"
      - name: Apply the patch
        run: git apply --index "$RUNNER_TEMP/evolution.patch"

      - uses: ./.github/actions/app-stack
      - name: pnpm check
        run: pnpm check
      - name: pnpm verify:all
        run: pnpm verify:all
      - name: pnpm verify:compare (before and after screenshots)
        env:
          FLOWS: ${{ steps.report.outputs.flows }}
        run: |
          read -r -a flows <<< "$FLOWS"
          pnpm verify:compare origin/main "${flows[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evolution-verify
          path: artifacts/verify/
          retention-days: 30

  publish:
    needs: [pick, agent, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evolution-patch
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evolution-verify
          path: artifacts/verify
      - name: Check the patch again, from this clean checkout
        run: pnpm -s evolution:check-patch "$RUNNER_TEMP/evolution.patch"

      - name: Evolution app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EVOLUTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.EVOLUTION_APP_PRIVATE_KEY }}
          # Push the branch, open the PR with its labels, and read the issue that open-pr checks again.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      # The patch goes on main as it is now, not on the build's base. If main's workflows changed during the build, a
      # branch from the old base would differ from main in .github/workflows/, and GitHub refuses that push from a token
      # without the workflows permission, which the bot token must never get (run 40031512734). CI and evolution-verify
      # judge the PR's real head, so the verified patch only has to apply cleanly. A run that pushed the branch but didn't
      # open its PR leaves the branch behind, and a retry's new commit isn't a fast-forward of it, so the push replaces it
      # (#107). It stops first if an open PR from this repository has the branch as its head.
      - name: Push the branch (in a separate worktree, so nothing here runs the PR's code)
        env:
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.pick.outputs.branch }}
          NUMBER: ${{ needs.pick.outputs.number }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json url,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | .url')
          if [ -n "$open" ]; then
            echo "::error::$BRANCH is the head of an open PR ($open). Merge or close it before building the issue again."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          git worktree add --detach "$RUNNER_TEMP/branch" origin/main
          cd "$RUNNER_TEMP/branch"
          if ! git apply --index "$RUNNER_TEMP/evolution.patch"; then
            echo "::error::The verified patch no longer applies to main. Build the issue again."
            exit 1
          fi
          git -c user.name="petri-evolution" -c user.email="petri-evolution@users.noreply.github.com" commit -q -m "evolution: build #$NUMBER"
          git push --force "https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open the PR from the template
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.pick.outputs.branch }}
          NUMBER: ${{ needs.pick.outputs.number }}
          REPORT: ${{ needs.agent.outputs.report }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p artifacts/evolution
          printf '%s' "$REPORT" > artifacts/evolution/build-report.json
          mapfile -t summaries < <(find artifacts/verify -mindepth 2 -maxdepth 2 -name summary.md)
          mapfile -t compares < <(find artifacts/verify -mindepth 2 -maxdepth 2 -name compare.json)
          if [ "${#summaries[@]}" -ne 1 ] || [ "${#compares[@]}" -ne 1 ]; then
            echo "::error::expected one verify:all run and one verify:compare run, got ${#summaries[@]} and ${#compares[@]}"
            exit 1
          fi
          pnpm -s evolution:open-pr "$BRANCH" "$NUMBER" artifacts/evolution/build-report.json "$(dirname "${summaries[0]}")" "$(dirname "${compares[0]}")"

      - name: Link the PR to the feedback and take the issue off the ready list
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.pick.outputs.number }}
          URL: ${{ steps.pr.outputs.url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm -s evolution:feedback-status building "$NUMBER" "$URL"
          gh issue edit "$NUMBER" --remove-label evolution:ready

  stuck:
    needs: [pick, agent, verify, publish]
    if: failure() && needs.pick.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Label the issue evolution:stuck
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.pick.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label evolution:stuck --remove-label evolution:ready
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "The build didn't produce a PR. The run has the builder's report, the patch and the verify output: $RUN_URL"
      # main's code only: this job never sees the agent's checkout or patch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # pick marked the feedback building. With no PR, put it back, so the board doesn't show work that stopped.
      - name: Put the linked feedback back to triaged
        env:
          NUMBER: ${{ needs.pick.outputs.number }}
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm -s evolution:feedback-status triaged "$NUMBER"
