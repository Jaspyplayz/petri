# Installed by `pnpm install` (lefthook's postinstall runs `lefthook install`; it skips CI).
# gitleaks must be on PATH: winget install Gitleaks.Gitleaks · brew install gitleaks
# Jobs run in order: typecheck's `next typegen` writes the route types that lint needs.
pre-commit:
  jobs:
    - name: secrets
      run: gitleaks git --pre-commit --staged --ignore-gitleaks-allow --redact --no-banner --verbose
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm -s typecheck
    - name: lint
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs}"
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
